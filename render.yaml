# Public server on Render's free tier: Dashboard → New → Blueprint → this repo → Deploy Blueprint.
# Auto-deploys on every push to main. Free instances sleep after 15 idle minutes and wake on the first join.
services:
  - type: web
    name: blackwater-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: BOTS
        value: "6"
      - key: MAX
        value: "16"
